<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- 背景グラデーション -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0e1a" />
      <stop offset="1" stop-color="#111a2e" />
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#1d2a4a" stop-opacity="0.9" />
      <stop offset="1" stop-color="#0a0e1a" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)" />
  <rect width="1200" height="630" fill="url(#glow)" />

  <!-- ロゴ（駅ピン）: faviconと同一デザイン -->
  <g transform="translate(170 215) scale(3.1)">
    <rect width="64" height="64" rx="14" fill="#0a0e1a" stroke="#1f2a44" stroke-width="2" />
    <circle cx="32" cy="28" r="13" fill="none" stroke="#46e0c8" stroke-width="5" />
    <path d="M32 41 L32 56" stroke="#5e7bff" stroke-width="5" stroke-linecap="round" />
  </g>

  <!-- テキスト -->
  <text x="430" y="270" font-family="'Hiragino Sans','Noto Sans JP',sans-serif" font-size="118" font-weight="900" fill="#f4f7ff">EkiHub</text>
  <text x="432" y="350" font-family="'Hiragino Sans','Noto Sans JP',sans-serif" font-size="44" font-weight="700" fill="#46e0c8">みんなの中心駅を探す</text>
  <text x="432" y="412" font-family="'Hiragino Sans','Noto Sans JP',sans-serif" font-size="30" font-weight="400" fill="#9fb0cc">複数人の最寄駅から、全員が集まりやすい駅を提案</text>
</svg>
