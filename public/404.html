<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>ページが見つかりません — EkiHub</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230a0e1a'/%3E%3Ccircle cx='32' cy='28' r='13' fill='none' stroke='%2346e0c8' stroke-width='5'/%3E%3Cpath d='M32 41 L32 56' stroke='%235e7bff' stroke-width='5' stroke-linecap='round'/%3E%3C/svg%3E"
    />
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: linear-gradient(135deg, #0a0e1a 0%, #111a2e 100%);
        color: #f4f7ff;
        font-family: "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
        text-align: center;
      }
      .box {
        max-width: 440px;
      }
      .code {
        font-size: 88px;
        font-weight: 900;
        line-height: 1;
        margin: 0;
        background: linear-gradient(120deg, #46e0c8, #5e7bff);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      h1 {
        font-size: 22px;
        font-weight: 700;
        margin: 16px 0 8px;
      }
      p {
        color: #9fb0cc;
        line-height: 1.7;
        margin: 0 0 28px;
      }
      .home {
        display: inline-block;
        padding: 12px 28px;
        border-radius: 999px;
        font-weight: 700;
        text-decoration: none;
        color: #0a0e1a;
        background: linear-gradient(120deg, #46e0c8, #5e7bff);
      }
      .home:hover {
        opacity: 0.9;
      }
    </style>
  </head>
  <body>
    <main class="box">
      <p class="code">404</p>
      <h1>ページが見つかりませんでした</h1>
      <p>
        お探しのページは移動または削除された可能性があります。<br />
        トップページから中心駅を探してみてください。
      </p>
      <a class="home" href="/">トップへ戻る</a>
    </main>
  </body>
</html>
